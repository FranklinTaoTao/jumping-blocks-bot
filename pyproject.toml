[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jumping-blocks-bot"
version = "0.1.0"
description = "An OpenCV and deterministic-planning bot for Jumping Blocks (跃动方块)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0,<3",
    "opencv-python>=4.10,<6",
    "python-xlib>=0.33,<1; sys_platform == 'linux'",
    "mss>=10,<11; sys_platform == 'win32'",
    "dxcam>=0.3,<0.4; sys_platform == 'win32'",
    "pywin32>=308; sys_platform == 'win32'",
    "numba>=0.68,<1",
]

[project.optional-dependencies]
dev = ["ruff>=0.17,<1", "build>=1.2,<2"]

[project.scripts]
jumping-blocks-bot = "jumpbot.cli:main"

[project.urls]
Repository = "https://github.com/FranklinTaoTao/jumping-blocks-bot"

[tool.setuptools.packages.find]
include = ["jumpbot*"]

[tool.setuptools.package-data]
jumpbot = ["assets/*.npz", "assets/*.json"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
